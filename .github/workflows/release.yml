name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and run offline checks
        run: make build check
      - name: Check the version matches the tag
        run: |
          built="$(.build/display-follow version)"
          if [ "v$built" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $built in Sources/DisplayFollowCore/Version.swift"
            exit 1
          fi
      - name: Package
        run: |
          name="display-follow-${GITHUB_REF_NAME}-macos-arm64"
          mkdir -p "dist/$name"
          cp .build/display-follow README.md "dist/$name/"
          cp launchd/com.display-follow.plist.in "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          shasum -a 256 "dist/$name.tar.gz" | tee "dist/$name.tar.gz.sha256"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 --generate-notes --title "$GITHUB_REF_NAME"
